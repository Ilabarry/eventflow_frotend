<header class="part-navbar">
  <div class="part-navbar__left">
    <!-- Burger : visible uniquement en dessous de 1024px -->
    <button
      type="button"
      class="part-navbar__burger"
      (click)="menuToggle.emit()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-controls="part-sidebar"
      aria-label="Ouvrir ou fermer le menu"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        @if (sidebarOpen()) {
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        } @else {
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        }
      </svg>
    </button>

    <!-- Logo -->
    <a routerLink="/participant/dashboard" class="part-navbar__brand" aria-label="EVENTFLOW - Dashboard">
      <span class="part-navbar__logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#6C5CE7"/>
          <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#22C7D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="part-navbar__logo-text">
        EVENT<span class="part-navbar__logo-accent">FLOW</span>
      </span>
    </a>
  </div>

  <div class="part-navbar__actions">
    <!-- Notifications -->
    <a routerLink="/participant/notifications" class="part-navbar__icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      @if (notificationCount() > 0) {
        <span class="part-navbar__badge">{{ badge(notificationCount()) }}</span>
      }
    </a>

    <!-- Messages -->
    <a routerLink="/participant/messages" class="part-navbar__icon-btn" aria-label="Messages">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      @if (messageCount() > 0) {
        <span class="part-navbar__badge">{{ badge(messageCount()) }}</span>
      }
    </a>

    <!-- Menu utilisateur -->
    <div class="part-navbar__user">
      <button
        type="button"
        class="part-navbar__user-btn"
        (click)="toggleUserMenu()"
        aria-haspopup="menu"
        [attr.aria-expanded]="userMenuOpen()"
      >
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" [alt]="userName()" class="part-navbar__avatar" />
        } @else {
          <span class="part-navbar__avatar part-navbar__avatar--initial">{{ initial() }}</span>
        }
        <span class="part-navbar__user-name">Hi {{ userName() }}</span>
        <svg
          class="part-navbar__chevron"
          [class.part-navbar__chevron--open]="userMenuOpen()"
          viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        >
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>

      @if (userMenuOpen()) {
        <div class="part-navbar__menu" role="menu">
          <a routerLink="/participant/profil" class="part-navbar__menu-item" role="menuitem" (click)="userMenuOpen.set(false)">
            Mon profil
          </a>
          <a routerLink="/participant/parametres" class="part-navbar__menu-item" role="menuitem" (click)="userMenuOpen.set(false)">
            Paramètres
          </a>
          <button type="button" class="part-navbar__menu-item part-navbar__menu-item--danger" role="menuitem" (click)="onLogout()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <path d="M16 17l5-5-5-5"></path>
              <path d="M21 12H9"></path>
            </svg>
            Se déconnecter
          </button>
        </div>
      }
    </div>
  </div>
</header>
