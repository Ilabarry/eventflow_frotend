<aside id="part-sidebar" class="part-sidebar" [class.part-sidebar--open]="open()" aria-label="Navigation participant">
  <nav class="part-sidebar__nav">
    <ul class="part-sidebar__list">
      @for (item of items; track item.path) {
        <li>
          <a
            [routerLink]="['/participant', item.path]"
            routerLinkActive="part-sidebar__link--active"
            class="part-sidebar__link"
            (click)="closed.emit()"
          >
            <svg class="part-sidebar__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              @for (d of item.icon; track d) {
                <path [attr.d]="d"></path>
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="part-sidebar__footer">
    <svg class="part-sidebar__wave" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="partWaveGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8B7CF6" />
          <stop offset="1" stop-color="#22C7D6" />
        </linearGradient>
      </defs>
      <path
        d="M0 42 C 20 12, 40 12, 60 32 S 100 56, 120 32 S 160 6, 200 20"
        fill="none"
        stroke="url(#partWaveGradient)"
        stroke-width="2.5"
        stroke-linecap="round"
      />
    </svg>
    <p class="part-sidebar__tagline">Participez, découvrez et vivez vos événements.</p>
    <span class="part-sidebar__brand">EVENTFLOW</span>
  </div>
</aside>
