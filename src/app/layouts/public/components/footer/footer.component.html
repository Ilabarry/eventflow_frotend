<footer class="footer">
  <div class="footer__container">
    <!-- Logo + copyright -->
    <div class="footer__brand">
      <a routerLink="/" class="footer__logo">
        <span class="footer__logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#FFFFFF"/>
            <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#22C7D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="footer__logo-text">
          EVENT<span class="text-cyan">FLOW</span>
        </span>
      </a>
      <p class="footer__copyright">© {{ currentYear }} EVENTFLOW. Tous droits réservés.</p>
    </div>

    <!-- Liens : masqués en mode minimal -->
    @if (!minimal) {
      <nav class="footer__links">
        <a routerLink="/events" class="footer__link">Événements</a>
        <a routerLink="/how-it-works" class="footer__link">Comment ça marche</a>
        <a routerLink="/about" class="footer__link">À propos</a>
      </nav>
    }

    <!-- Réseaux sociaux -->
    <div class="footer__social">
      <!-- ... inchangé ... -->
    </div>
  </div>
</footer>
